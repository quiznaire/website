name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static website
        run: npm run build:pages
        env:
          GITHUB_PAGES_CUSTOM_DOMAIN: quiznaire.in

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Branch-based Pages publishing can overwrite the Next.js export.
      # Publish our artifact last if the repository still has that source enabled.
      - name: Wait for competing branch-based Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import time
          import urllib.request

          url = (
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs?head_sha={os.environ['GITHUB_SHA']}&per_page=100"
          )
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
          }
          for attempt in range(36):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  runs = json.load(response)["workflow_runs"]
              competing = [
                  run for run in runs
                  if run["name"] == "pages build and deployment"
                  and run["head_sha"] == os.environ["GITHUB_SHA"]
                  and run["status"] != "completed"
              ]
              if not competing:
                  print("No competing Pages deployment is running. Publishing static export.")
                  break
              print("Waiting for branch-based Pages deployment to finish.")
              time.sleep(10)
          else:
              raise SystemExit("Branch-based Pages deployment did not finish within six minutes.")
          PYTHON

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
